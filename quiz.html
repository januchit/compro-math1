<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>แบบทดสอบท้ายบท — ComPro Math 1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%234456c7'/%3E%3Ctext x='50' y='70' font-size='62' text-anchor='middle' fill='white' font-family='Georgia'%3E%CF%80%3C/text%3E%3C/svg%3E" />
  <style>
    .quiz-wrap { max-width: 780px; margin: 0 auto; }
    .quiz-head { text-align: center; margin-bottom: 28px; }
    .quiz-head .eyebrow { margin-bottom: 12px; }
    .quiz-head h2 { font-size: clamp(22px, 3vw, 30px); color: var(--ink); }
    #prevScore { margin-top: 10px; color: var(--ink-soft); font-size: 14.5px; }
    .q-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 22px 24px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
    .q-head { margin-bottom: 6px; }
    .q-no { font-size: 12.5px; font-weight: 700; color: var(--accent); background: var(--accent-bg);
      padding: 3px 11px; border-radius: 999px; }
    .q-text { font-size: 17px; color: var(--ink); font-weight: 600; margin: 10px 0 16px;
      line-height: 1.5; white-space: pre-wrap; }
    .choices { display: flex; flex-direction: column; gap: 10px; }
    .choice { display: flex; align-items: center; gap: 12px; padding: 12px 15px;
      border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; transition: all .12s ease; }
    .choice:hover { border-color: var(--accent-2); background: #fafbff; }
    .choice input { display: none; }
    .choice-mark { display: grid; place-items: center; width: 28px; height: 28px; flex: 0 0 28px;
      border-radius: 50%; background: var(--accent-bg); color: var(--accent);
      font-weight: 700; font-size: 14px; font-family: var(--sans); }
    .choice-text { font-size: 15.5px; color: var(--ink-soft); }
    .choice:has(input:checked) { border-color: var(--accent); background: var(--accent-bg); }
    .choice.correct { border-color: #1f8a4c; background: #e8f8ee; }
    .choice.correct .choice-mark { background: #1f8a4c; color: #fff; }
    .choice.wrong { border-color: #d64545; background: #fdeaea; }
    .choice.wrong .choice-mark { background: #d64545; color: #fff; }
    .q-explain { margin-top: 14px; padding: 12px 15px; background: #fff8e8; border: 1px solid #f4e2b8;
      border-radius: 10px; font-size: 14.5px; color: #6b5514; line-height: 1.6; }
    .quiz-actions { text-align: center; margin: 26px 0; }
    .btn.lg { font-size: 16px; padding: 14px 34px; }
    .result-panel { text-align: center; border-radius: var(--radius); padding: 30px 26px;
      margin: 10px 0 26px; border: 1.5px solid var(--line); }
    .result-panel.pass { background: #e8f8ee; border-color: #9fddb5; }
    .result-panel.fail { background: #fdf3e8; border-color: #f0d3a8; }
    #resultIcon { font-size: 52px; line-height: 1; }
    #resultText { margin-top: 12px; font-size: 17px; color: var(--ink); line-height: 1.6; }
    #medalHint { margin-top: 14px; font-size: 13px; color: var(--muted);
      background: rgba(255,255,255,.6); border: 1px solid var(--line);
      border-radius: 10px; padding: 8px 14px; display: inline-block; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a class="brand" href="index.html">
        <span class="logo">π</span>
        <span>ComPro Math 1 <small>040223101 · KMUTNB</small></span>
      </a>
      <nav class="topnav">
        <a href="index.html#books">หนังสือเรียน</a>
        <a href="exercises.html">แบบฝึกหัด</a>
        <a href="quizzes.html">แบบทดสอบ</a>
      </nav>
    </div>
  </header>

  <section class="section" style="padding-top: 48px;">
    <div class="container">
      <div class="quiz-wrap" id="quizArea">
        <div class="quiz-head">
          <span class="eyebrow">📝 Quiz</span>
          <h2 id="quizChTitle">แบบทดสอบท้ายบท</h2>
          <div id="prevScore"></div>
        </div>

        <div id="questions"></div>

        <div class="quiz-actions">
          <button class="btn btn-primary lg" id="submitBtn" hidden>ส่งคำตอบ</button>
        </div>

        <div class="result-panel" id="resultPanel" hidden>
          <div id="resultIcon"></div>
          <div id="resultText"></div>
          <div id="medalHint"></div>
          <div class="quiz-actions" style="margin-bottom:0;">
            <button class="btn btn-ghost" id="retryBtn" hidden>ทำอีกครั้ง</button>
            <a class="btn btn-ghost" href="quizzes.html">ดูแบบทดสอบทั้งหมด</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <span>© 2569 (2026) · Department of Mathematics, Faculty of Applied Science, KMUTNB</span>
      <span>Assoc. Prof. Dr. Anuchit Jitpattanakul</span>
    </div>
  </footer>

  <script type="module" src="assets/js/quiz.js"></script>
</body>
</html>
